name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so a maintainer can run scripts/versions.py --backfill
          # against a clone without fetching more.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
      - run: python -m pip install check-jsonschema
      - run: check-jsonschema --schemafile schemas/index-v1.schema.json index.json
      # Only the current releases are validated against the CURRENT manifest
      # schema. Archived releases span every manifest generation the market has
      # published (wasm@1 packages were installable by the servers that ran
      # them), so they are gated by signature verification and by
      # scripts/versions.py --check instead of by today's schema.
      - run: check-jsonschema --schemafile schemas/manifest-v3.schema.json plugins/*.json
      # The index schema carries two lanes and a conditional requirement per
      # lane; the published index only exercises the integration half today.
      - run: check-jsonschema --schemafile schemas/index-v1.schema.json tests/fixtures/index-automation.json
      - name: Reject index entries that break the lane rules
        run: |
          for fixture in tests/fixtures/index-integration-missing-provider.json \
                         tests/fixtures/index-automation-without-job.json; do
            if check-jsonschema --schemafile schemas/index-v1.schema.json "$fixture"; then
              echo "expected $fixture to be rejected" >&2
              exit 1
            fi
          done
      - run: make check
